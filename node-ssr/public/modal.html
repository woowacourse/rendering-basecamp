<div class="modal-background active">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="movie-title">
    <div class="modal-header">
      <h1 id="movie-title" class="modal-title">{{MOVIE_TITLE}}</h1>
      <a href="/" class="modal-close-btn" aria-label="영화 상세 닫기">
        <img
          src="/images/modal_button_close.png"
          width="24"
          height="24"
          alt=""
        />
      </a>
    </div>

    <div class="modal-container">
      <img
        src="{{MOVIE_POSTER_URL}}"
        alt="{{MOVIE_TITLE}}"
        class="modal-image"
      />
      <div class="modal-description">
        <div class="movie-info-line">
          <span class="movie-meta">{{MOVIE_GENRES}}</span>
          <div class="movie-rating">
            <img
              src="/images/star_filled.png"
              width="16"
              height="16"
              alt=""
            />
            <span class="rating-value">{{MOVIE_VOTE_AVERAGE}}</span>
          </div>
        </div>

        <div class="overview-section">
          <p class="overview-text">{{MOVIE_OVERVIEW}}</p>
        </div>

        <div class="my-rating-section">
          <div class="rating-header">
            <span class="rating-label">내 별점</span>
            <div class="star-rating">
              <img
                src="/images/star_empty.png"
                width="24"
                height="24"
                alt="Star 1"
              />
              <img
                src="/images/star_empty.png"
                width="24"
                height="24"
                alt="Star 2"
              />
              <img
                src="/images/star_empty.png"
                width="24"
                height="24"
                alt="Star 3"
              />
              <img
                src="/images/star_empty.png"
                width="24"
                height="24"
                alt="Star 4"
              />
              <img
                src="/images/star_empty.png"
                width="24"
                height="24"
                alt="Star 5"
              />
              <span class="rating-text">별점을 남겨주세요</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
