<li class="movie-item">
  <a class="item" href="/detail/{{id}}">
    <img class="thumbnail" src="{{poster}}" alt="{{title}}" loading="lazy" />
    <div class="item-desc">
      <p class="rate">
        <img src="/images/star_empty.png" class="star" />
        <span>{{rating}}</span>
      </p>
      <strong>{{title}}</strong>
    </div>
  </a>
</li>
