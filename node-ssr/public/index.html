<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{PAGE_DESCRIPTION}}" />
    {{OPEN_GRAPH_TAGS}}
    <link rel="stylesheet" href="/styles/bundle.css" />
    <title>{{PAGE_TITLE}}</title>
  </head>
  <body>
    <div id="wrap">
      <header>
        <div
          class="background-container"
          style="background-image: url({{FEATURED_BACKGROUND_URL}});"
        >
          <div class="overlay"></div>
          <div class="top-rated-container">
            <a href="/">
              <img
                src="/images/logo.png"
                width="117"
                height="20"
                class="logo"
                alt="MovieLogo"
              />
            </a>
            <div class="top-rated-movie">
              <div class="rate">
                <img
                  src="/images/star_empty.png"
                  width="32"
                  height="32"
                  alt=""
                />
                <span class="text-2xl font-semibold text-yellow"
                  >{{FEATURED_VOTE_AVERAGE}}</span
                >
              </div>
              <h1 class="text-3xl font-semibold">{{FEATURED_TITLE}}</h1>
              <a class="primary detail" href="/detail/{{FEATURED_ID}}"
                >자세히 보기</a
              >
            </div>
          </div>
        </div>
      </header>
      <main>
        <section class="container">
          <h2 class="text-2xl font-bold mb-64">지금 인기 있는 영화</h2>
          <ul class="thumbnail-list">
            {{MOVIE_LIST}}
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p>&copy; 우아한테크코스 All Rights Reserved.</p>
        <p>
          <img
            src="/images/woowacourse_logo.png"
            width="180"
            alt="우아한테크코스"
          />
        </p>
      </footer>
    </div>
    {{MOVIE_DETAIL_MODAL}}
  </body>
</html>
